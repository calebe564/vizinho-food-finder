    <meta name="theme-color" content="#0057FF" />
    <!-- Aplica o tema antes da página aparecer (evita piscar branco no modo escuro). Mesma regra de src/lib/theme.ts -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('theme');
          var dark = p === 'dark' || (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          r.classList.add(dark ? 'dark' : 'light');
          r.style.colorScheme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0c151d' : '#0057FF');
        } catch (e) {}
      })();
    </script>
    
    <title>Comércio Vizinho - Comércio e serviços do seu bairro</title>
